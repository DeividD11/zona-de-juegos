<!doctype html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <link href="assets/css/global.css" rel="stylesheet"/>
  <title>
   Dashboard · Zona de Juegos
  </title>
 </head>
 <body>
  <div class="app-shell">
   <div class="container">
    <header aria-label="Navegación principal" class="site-header">
     <a class="brand" href="dashboard.html">
      <span class="brand-mark">
       🎮
      </span>
      <span>
       Zona de Juegos
      </span>
     </a>
     <nav aria-label="Navegación de usuario" class="nav-actions">
      <a class="button button--ghost" href="pages/profile.html">
       Perfil
      </a>
      <a class="button button--ghost" hidden="" href="admin.html" id="adminLink">
       Administración
      </a>
      <button class="button button--danger" id="logoutButton" type="button">
       Salir
      </button>
     </nav>
    </header>
    <main class="main">
     <section class="dashboard-head">
      <div>
       <span class="eyebrow">
        Hola,
        <span id="userName">
         Jugador
        </span>
       </span>
       <h1>
        Elige tu juego
       </h1>
       <p id="userRole">
        Jugador
       </p>
      </div>
     </section>
     <div class="message" hidden="" id="dashboardMessage">
     </div>
     <section class="section">
      <div class="section-header">
       <h2>
        Juegos disponibles
       </h2>
      </div>
      <div class="games-grid" id="gamesGrid">
       <div class="panel">
        Cargando juegos…
       </div>
      </div>
     </section>
     <section class="section">
      <div class="section-header">
       <h2>
        Mis mejores puntuaciones
       </h2>
      </div>
      <div class="panel">
       <table class="table">
        <thead>
         <tr>
          <th>
           Juego
          </th>
          <th>
           Mejor puntuación
          </th>
          <th>
           Última partida
          </th>
         </tr>
        </thead>
        <tbody id="scoresBody">
         <tr>
          <td colspan="3">
           Cargando…
          </td>
         </tr>
        </tbody>
       </table>
      </div>
     </section>
    </main>
    <footer class="footer">
     Tu progreso se guarda de forma segura en la base de datos.
    </footer>
   </div>
  </div>
  <script src="js/pages/dashboard.page.js" type="module">
  </script>
 </body>
</html>
