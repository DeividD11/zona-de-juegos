<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/global.css"><title>Restablecer contraseña · Zona de Juegos</title></head>
<body class="auth-page">
<main class="auth-card">
  <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>Zona de Juegos</span></a>
  <div style="margin-top:28px"><span class="eyebrow">Nueva contraseña</span><h1>Restablecer acceso</h1><p>El enlace es temporal y, al completarlo, se cerrarán las demás sesiones de tu cuenta.</p></div>
  <div id="formMessage" class="message" role="alert" aria-live="assertive" hidden></div>
  <form id="resetPasswordForm" class="form">
    <input id="resetToken" type="hidden" name="token">
    <div class="field"><label for="new_password">Nueva contraseña</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
    <div class="field"><label for="confirm_password">Confirmar contraseña</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
    <button id="resetPasswordButton" class="button button--primary" type="submit">Restablecer contraseña</button>
  </form>
  <div class="form-footer" style="margin-top:18px"><a href="login.html">Volver a iniciar sesión</a></div>
</main>
<script type="module">import { initResetPassword } from './js/controllers/recovery.controller.js'; initResetPassword();</script>
</body></html>
