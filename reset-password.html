<!doctype html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <link href="assets/css/global.css" rel="stylesheet"/>
  <title>
   Restablecer contraseña · Zona de Juegos
  </title>
 </head>
 <body class="auth-page">
  <main class="auth-card">
   <header>
    <a aria-label="Zona de Juegos, página de inicio" class="brand" href="index.html">
     <span aria-hidden="true" class="brand-mark">
      🎮
     </span>
     <span>
      Zona de Juegos
     </span>
    </a>
   </header>
   <section aria-labelledby="reset-title">
    <div class="auth-intro">
     <span class="eyebrow">
      Nueva contraseña
     </span>
     <h1 id="reset-title">
      Restablecer acceso
     </h1>
     <p id="reset-help">
      El enlace es temporal y, al completarlo, se cerrarán las demás sesiones.
     </p>
    </div>
    <div aria-live="assertive" class="message" hidden="" id="formMessage" role="alert">
    </div>
    <form aria-describedby="reset-help" class="form" id="resetPasswordForm" novalidate="">
     <input autocomplete="off" id="resetToken" name="token" type="hidden"/>
     <div class="field">
      <label for="new_password">
       Nueva contraseña
      </label>
      <input aria-describedby="new_passwordError" autocomplete="new-password" id="new_password" maxlength="128" minlength="8" name="new_password" required="" type="password"/>
      <span class="field-error" hidden="" id="new_passwordError" role="alert">
      </span>
     </div>
     <div class="field">
      <label for="confirm_password">
       Confirmar contraseña
      </label>
      <input aria-describedby="confirm_passwordError" autocomplete="new-password" id="confirm_password" maxlength="128" minlength="8" name="confirm_password" required="" type="password"/>
      <span class="field-error" hidden="" id="confirm_passwordError" role="alert">
      </span>
     </div>
     <button class="button button--primary" id="resetPasswordButton" type="submit">
      Restablecer contraseña
     </button>
    </form>
   </section>
   <footer class="form-footer">
    <a href="login.html">
     Volver a iniciar sesión
    </a>
   </footer>
  </main>
  <script src="js/pages/reset-password.page.js" type="module">
  </script>
 </body>
</html>
