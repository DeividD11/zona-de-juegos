<!doctype html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <link href="assets/css/global.css" rel="stylesheet"/>
  <title>
   Iniciar sesión · Zona de Juegos
  </title>
 </head>
 <body class="auth-page">
  <main class="auth-card">
   <header>
    <a aria-label="Zona de Juegos, página de inicio" class="brand" href="index.html">
     <span aria-hidden="true" class="brand-mark">
      🎮
     </span>
     <span>
      Zona de Juegos
     </span>
    </a>
   </header>
   <section aria-labelledby="login-title">
    <div class="auth-intro">
     <span class="eyebrow">
      Acceso
     </span>
     <h1 id="login-title">
      Bienvenido de nuevo
     </h1>
     <p id="login-help">
      Inicia sesión para continuar al catálogo de juegos.
     </p>
    </div>
    <div aria-live="assertive" class="message" hidden="" id="formMessage" role="alert">
    </div>
    <form aria-describedby="login-help" class="form" id="loginForm" novalidate="">
     <div class="field">
      <label for="email">
       Correo electrónico
      </label>
      <input aria-describedby="emailError" autocomplete="email" id="email" inputmode="email" name="email" required="" type="email"/>
      <span class="field-error" hidden="" id="emailError" role="alert">
      </span>
     </div>
     <div class="field">
      <label for="password">
       Contraseña
      </label>
      <input aria-describedby="passwordError" autocomplete="current-password" id="password" minlength="8" name="password" required="" type="password"/>
      <span class="field-error" hidden="" id="passwordError" role="alert">
      </span>
     </div>
     <button class="button button--primary" id="loginSubmit" type="submit">
      Iniciar sesión
     </button>
    </form>
   </section>
   <footer class="form-footer">
    <a href="forgot-password.html">
     ¿Olvidaste tu contraseña?
    </a>
    <span>
     ¿No tienes cuenta?
     <a href="register.html">
      Regístrate
     </a>
    </span>
   </footer>
  </main>
  <script src="js/pages/login.page.js" type="module">
  </script>
 </body>
</html>
