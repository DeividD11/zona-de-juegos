<!doctype html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <link href="assets/css/global.css" rel="stylesheet"/>
  <title>
   Crear cuenta · Zona de Juegos
  </title>
 </head>
 <body class="auth-page">
  <main class="auth-card">
   <header>
    <a aria-label="Zona de Juegos, página de inicio" class="brand" href="index.html">
     <span aria-hidden="true" class="brand-mark">
      🎮
     </span>
     <span>
      Zona de Juegos
     </span>
    </a>
   </header>
   <section aria-labelledby="register-title">
    <div class="auth-intro">
     <span class="eyebrow">
      Registro
     </span>
     <h1 id="register-title">
      Crea tu cuenta
     </h1>
     <p id="register-help">
      Las cuentas nuevas se crean como jugadores.
     </p>
    </div>
    <div aria-live="assertive" class="message" hidden="" id="formMessage" role="alert">
    </div>
    <form aria-describedby="register-help" class="form" id="registerForm" novalidate="">
     <div class="field">
      <label for="display_name">
       Nombre
      </label>
      <input aria-describedby="display_nameError" autocomplete="name" id="display_name" maxlength="80" minlength="2" name="display_name" required="" type="text"/>
      <span class="field-error" hidden="" id="display_nameError" role="alert">
      </span>
     </div>
     <div class="field">
      <label for="email">
       Correo electrónico
      </label>
      <input aria-describedby="emailError" autocomplete="email" id="email" inputmode="email" name="email" required="" type="email"/>
      <span class="field-error" hidden="" id="emailError" role="alert">
      </span>
     </div>
     <div class="field">
      <label for="password">
       Contraseña
      </label>
      <input aria-describedby="passwordError" autocomplete="new-password" id="password" maxlength="128" minlength="8" name="password" required="" type="password"/>
      <span class="field-error" hidden="" id="passwordError" role="alert">
      </span>
     </div>
     <div class="field">
      <label for="confirm_password">
       Confirmar contraseña
      </label>
      <input aria-describedby="confirm_passwordError" autocomplete="new-password" id="confirm_password" maxlength="128" minlength="8" name="confirm_password" required="" type="password"/>
      <span class="field-error" hidden="" id="confirm_passwordError" role="alert">
      </span>
     </div>
     <button class="button button--primary" id="registerSubmit" type="submit">
      Crear cuenta
     </button>
    </form>
   </section>
   <footer class="form-footer">
    <span>
     ¿Ya tienes cuenta?
    </span>
    <a href="login.html">
     Inicia sesión
    </a>
   </footer>
  </main>
  <script src="js/pages/register.page.js" type="module">
  </script>
 </body>
</html>
