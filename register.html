<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/global.css"><title>Crear cuenta · Zona de Juegos</title></head><body class="auth-page"><main class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>Zona de Juegos</span></a><div style="margin-top:28px"><span class="eyebrow">Registro</span><h1>Crea tu cuenta</h1><p>Las cuentas nuevas se crean como jugadores. El administrador inicial se configura de forma segura durante la instalación.</p></div><div id="formMessage" class="message" role="alert" aria-live="assertive" hidden></div><form id="registerForm" class="form"><div class="field"><label for="display_name">Nombre</label><input id="display_name" name="display_name" type="text" autocomplete="name" minlength="2" maxlength="80" required></div><div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirm_password">Confirmar contraseña</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div><button id="registerSubmit" class="button button--primary" type="submit">Crear cuenta</button></form><div class="form-footer" style="margin-top:18px"><span>¿Ya tienes cuenta?</span><a href="login.html">Inicia sesión</a></div></main><script type="module">import { initRegister } from './js/controllers/auth.controller.js'; initRegister();</script></body></html>
