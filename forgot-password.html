<!doctype html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <link href="assets/css/global.css" rel="stylesheet"/>
  <title>
   Recuperar cuenta · Zona de Juegos
  </title>
 </head>
 <body class="auth-page">
  <main class="auth-card">
   <header>
    <a aria-label="Zona de Juegos, página de inicio" class="brand" href="index.html">
     <span aria-hidden="true" class="brand-mark">
      🎮
     </span>
     <span>
      Zona de Juegos
     </span>
    </a>
   </header>
   <section aria-labelledby="recover-title">
    <div class="auth-intro">
     <span class="eyebrow">
      Recuperación
     </span>
     <h1 id="recover-title">
      Recuperar cuenta
     </h1>
     <p id="recover-help">
      Indica el correo de tu cuenta para preparar un enlace temporal de recuperación.
     </p>
    </div>
    <div aria-live="assertive" class="message" hidden="" id="formMessage" role="alert">
    </div>
    <form aria-describedby="recover-help" class="form" id="forgotPasswordForm" novalidate="">
     <div class="field">
      <label for="email">
       Correo electrónico
      </label>
      <input aria-describedby="emailError" autocomplete="email" id="email" inputmode="email" name="email" required="" type="email"/>
      <span class="field-error" hidden="" id="emailError" role="alert">
      </span>
     </div>
     <button class="button button--primary" id="forgotPasswordButton" type="submit">
      Solicitar recuperación
     </button>
    </form>
   </section>
   <footer class="form-footer">
    <a href="login.html">
     Volver a iniciar sesión
    </a>
   </footer>
  </main>
  <script src="js/pages/forgot-password.page.js" type="module">
  </script>
 </body>
</html>
