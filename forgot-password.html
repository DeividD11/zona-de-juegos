<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/global.css"><title>Recuperar cuenta · Zona de Juegos</title></head>
<body class="auth-page">
<main class="auth-card">
  <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>Zona de Juegos</span></a>
  <div style="margin-top:28px"><span class="eyebrow">Recuperación</span><h1>Recuperar cuenta</h1><p>Indica el correo de tu cuenta para preparar un enlace temporal de recuperación.</p></div>
  <div id="formMessage" class="message" role="alert" aria-live="assertive" hidden></div>
  <form id="forgotPasswordForm" class="form">
    <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <button id="forgotPasswordButton" class="button button--primary" type="submit">Solicitar recuperación</button>
  </form>
  <div class="form-footer" style="margin-top:18px"><a href="login.html">Volver a iniciar sesión</a></div>
</main>
<script type="module">import { initForgotPassword } from './js/controllers/recovery.controller.js'; initForgotPassword();</script>
</body></html>
