<!doctype html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <link href="../assets/css/global.css" rel="stylesheet"/>
  <title>
   Juego · Zona de Juegos
  </title>
 </head>
 <body class="game-page">
  <div class="app-shell">
   <div class="container">
    <header aria-label="Navegación principal" class="site-header">
     <a class="brand" href="../dashboard.html">
      <span class="brand-mark">
       🎮
      </span>
      <span>
       Zona de Juegos
      </span>
     </a>
     <nav aria-label="Navegación de usuario" class="nav-actions">
      <a class="button button--ghost" href="../dashboard.html">
       Catálogo
      </a>
      <button class="button button--danger" id="logoutButton" type="button">
       Salir
      </button>
     </nav>
    </header>
    <main class="main">
     <section class="game-heading">
      <span class="eyebrow">
       Partida
      </span>
      <h1 id="gameTitle">
       SNAKE
      </h1>
      <p id="gameDescription">
      </p>
     </section>
     <section class="panel snake-card">
      <div class="message" hidden="" id="gameMessage">
      </div>
      <div aria-busy="true" aria-live="polite" id="gameApp">
       <div class="state-card state-card--loading" role="status">
        <span aria-hidden="true" class="spinner">
        </span>
        <div>
         <strong>
          Cargando juego…
         </strong>
         <p>
          Preparando la partida.
         </p>
        </div>
       </div>
      </div>
     </section>
    </main>
   </div>
  </div>
  <script src="../js/pages/game.page.js" type="module">
  </script>
 </body>
</html>
